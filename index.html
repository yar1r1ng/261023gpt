<section id="intro" class="card"><span class="eyebrow">나에게 맞는 다음 게임 찾기</span><h1>내 취향에 맞을<br><span>게임은?</span></h1><p class="intro">스토리를 따라가는 게 좋을까, 친구와 협력하는 게 좋을까? 열 가지 질문에 답하면 당신의 플레이 스타일과 어울리는 게임을 찾아드려요.</p><div class="chips"><span class="chip">질문 10개</span><span class="chip">약 2분</span><span class="chip">결과 유형 10가지</span></div><div class="actions"><button class="primary" id="start">테스트 시작하기 →</button><span class="small">정답은 없어요. 평소 취향대로 골라주세요.</span></div></section>
<section id="quiz" class="card hidden" aria-live="polite"><div class="quiz-head"><span class="step" id="step"></span><span class="small" id="status">하나를 선택해 주세요</span><div class="answer-trail" id="answerTrail" aria-label="지금까지 선택한 답"></div></div><div class="track" role="progressbar" aria-label="테스트 진행률" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div class="fill" id="fill"></div></div><h2 class="question" id="question"></h2><p class="hint">가장 끌리는 쪽을 편하게 선택해 보세요.</p><div id="options" class="options"></div><div class="quiz-footer"><button class="back" id="back">← 이전 질문</button><button class="primary" id="next" disabled>다음 질문 →</button></div></section>

const results={
N:{title:"이야기 속으로 걸어 들어가는 서사 탐험가",sub:"인물과 세계의 이야기가 오래 기억에 남아요.",desc:"당신은 게임을 또 하나의 이야기책처럼 즐기는 타입이에요. 매력적인 캐릭터와 세계관을 알아가고, 선택의 여운을 곱씹을 때 가장 큰 재미를 느껴요.",games:[["디스코 엘리시움","대화와 선택으로 주인공의 이야기를 만들어 가요."],["라이프 이즈 스트레인지","감정적인 서사와 선택의 결과를 경험할 수 있어요."],["옥센프리","미스터리한 분위기와 자연스러운 대화가 매력적이에요."]],reasons:["이야기와 캐릭터에 대한 기대가 높았어요.","서사와 선택의 여운을 즐기는 답을 자주 골랐어요.","천천히 몰입하는 플레이를 선호했어요."]},

S:{title:"함께라서 더 신나는 팀 플레이어",sub:"좋은 게임은 같이할 사람이 있을 때 완성돼요.",desc:"당신은 함께 웃고 협력하는 순간을 소중하게 여겨요. 역할을 나누고 서로 도우며 목표를 이루거나, 친구와 편하게 한 판 즐기는 게임이 잘 맞아요.",games:[["잇 테이크스 투","두 사람의 협력으로 퍼즐과 모험을 풀어요."],["오버쿡드! 2","정신없는 주방에서 소통과 팀워크를 시험해요."],["딥 락 갤럭틱","친구들과 역할을 나눠 동굴 탐험을 떠나요."]],reasons:["다른 사람과 함께하는 재미를 자주 선택했어요.","협동과 소통에서 플레이의 동기를 얻어요.","친구와 공유할 순간을 중요하게 생각해요."]},
M:{title:"세상을 빚어 가는 자유로운 창작자",sub:"정답보다 나만의 방식과 공간이 중요해요.",desc:"당신은 만들고 꾸미고 탐험하는 자유를 사랑해요. 정해진 답보다 작은 아이디어를 키워 나만의 세계를 만드는 데서 편안함과 재미를 느껴요.",games:[["마인크래프트","건축, 탐험, 생존을 원하는 방식으로 즐겨요."],["스타듀 밸리","농장과 마을을 천천히 나만의 삶으로 꾸려요."],["언패킹","물건을 정리하며 공간과 이야기를 완성해요."]],reasons:["꾸미기와 제작, 자유로운 선택을 좋아해요.","자기 페이스로 즐기는 게임과 잘 맞아요.","게임 안에 나만의 결과물을 남기는 편이에요."]},

NS:{title:"친구와 이야기를 만드는 협동 탐험가",sub:"함께 겪은 모험이 가장 좋은 이야기가 돼요.",desc:"당신은 사람과 세계를 모두 중요하게 여겨요. 함께 임무를 수행하며 생기는 에피소드와 대화를 좋아하고, 협력 속에서 이야기를 발견하는 게임이 잘 맞아요.",games:[["잇 테이크스 투","둘이 함께 풀어 가는 창의적인 이야기 모험이에요."],["씨 오브 시브즈","친구들과 배를 타고 매번 다른 이야기를 만들어요."],["발더스 게이트 3","동료와 함께 선택하고 전술적으로 모험해요."]],reasons:["이야기와 함께하는 경험을 모두 선호해요.","친구와 공유하는 모험을 좋아해요.","협동하며 발견하는 서사와 잘 맞아요."]},
NM:{title:"나만의 세계에 머무는 감성 탐험가",sub:"천천히 둘러보고, 마음 가는 대로 채워 가요.",desc:"당신은 분위기와 이야기에 끌리면서도 자유로운 플레이를 원해요. 서두르지 않고 장소를 탐색하고 작은 선택으로 경험을 완성하는 게임이 어울려요.",games:[["스피릿페어러","아름다운 세계에서 인연과 이별을 돌봐요."],["동물의 숲: 뉴 호라이즌","섬을 꾸미고 이웃과 나만의 일상을 만들어요."],["저니","낯선 풍경을 통과하는 짧고 시적인 여정이에요."]],reasons:["분위기와 자유로운 탐험을 함께 선호해요.","자기 속도로 즐기는 플레이를 중요하게 생각해요.","세계를 둘러보며 개인적인 의미를 찾는 편이에요."]},
CS:{title:"승부도 협력도 잘하는 플레이 메이커",sub:"팀과 호흡을 맞추고 목표를 이루는 재미.",desc:"당신은 게임에서 분명한 목표와 사람들과의 교류를 모두 찾아요. 경쟁에서 실력을 겨루거나 팀이 힘을 합쳐 미션을 깨는 플레이가 잘 맞습니다.",games:[["로켓 리그","간단한 규칙 속에서 팀 전술과 실력을 겨뤄요."],["에이펙스 레전드","팀의 역할과 빠른 판단이 승리를 만들어요."],["딥 락 갤럭틱","협동과 전투, 임무 완수가 균형을 이뤄요."]],reasons:["목표와 팀플레이에 모두 끌려요.","함께 실력을 발휘하는 순간을 즐겨요.","협력이나 경쟁에서 활력을 얻어요."]},
CM:{title:"전략적으로 설계하는 시스템 메이커",sub:"생각한 대로 굴러가는 나만의 판을 만들어요.",desc:"당신은 도전과 자유를 함께 좋아해요. 규칙을 이해해 더 나은 구조를 만들고, 실험하며 전략을 개선하는 과정에서 재미를 느껴요.",games:[["팩토리오","생산 라인을 직접 설계하고 끝없이 개선해요."],["시티즈: 스카이라인","도시의 구조와 흐름을 계획하고 운영해요."],["림월드","예측하기 어려운 상황에서 정착지의 이야기를 만들어요."]],reasons:["도전적인 목표와 창작의 자유가 모두 중요해요.","설계하고 개선하는 과정에 재미를 느껴요.","시스템을 이해해 나만의 해결책을 찾는 편이에요."]},
SM:{title:"사람과 공간을 잇는 따뜻한 메이커",sub:"같이 놀고, 함께 가꾸는 시간이 좋아요.",desc:"당신은 편안한 창작과 사람 사이의 온기를 좋아해요. 함께 무언가를 만들거나 아기자기한 공간을 가꾸며 소소한 성취를 나누는 게임이 잘 맞아요.",games:[["스타듀 밸리","농장도 마을 관계도 원하는 속도로 키워 가요."],["레고 포트나이트","친구들과 생존하고 함께 공간을 지어요."],["플레이투게더","가벼운 미니게임과 꾸미기를 친구와 즐겨요."]],reasons:["사람들과 함께하는 편안한 플레이를 선호해요.","꾸미고 가꾸는 즐거움도 중요하게 생각해요.","경쟁보다 함께 만든 경험에 끌려요."]}
};
const $=s=>document.querySelector(s), intro=$("#intro"),quiz=$("#quiz"),result=$("#result"),answers=Array(11).fill(null);let index=0;const combatStyleQuestion=["어떤 전투 방식이 가장 마음에 드나요?",["총이나 활처럼 멀리서 공격하는 방식","격투나 검처럼 가까이서 싸우는 방식","마법이나 스킬을 사용하는 방식","특별히 선호하는 방식은 없어요"]];function activeQuestions(){return answers[5]===3?questions:questions.slice(0,6).concat([combatStyleQuestion],questions.slice(6))}
function draw(){const list=activeQuestions(),[q,choices]=list[index];$("#step").textContent=`QUESTION ${String(index+1).padStart(2,"0")} / ${list.length}`;$("#question").textContent=q;$("#status").textContent=answers[index]===null?"하나를 선택해 주세요":"선택 완료";$("#answerTrail").replaceChildren();answers.forEach((answer,i)=>{if(answer===null||i===index)return;const list=activeQuestions();if(!list[i])return;const pill=document.createElement("span");pill.className="answer-pill";pill.textContent=`${i+1}${String.fromCharCode(65+answer)}`;pill.title=`${list[i][0]}: ${list[i][1][answer]}`;$("#answerTrail").append(pill)});$("#fill").style.width=`${index/list.length*100}%`;$(".track").setAttribute("aria-valuemax",list.length);$(".track").setAttribute("aria-valuenow",index);$("#options").replaceChildren();choices.forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.className="option"+(answers[index]===i?" selected":"");b.setAttribute("aria-pressed",answers[index]===i);const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+i);const t=document.createElement("span");t.className="option-text";t.textContent=label;b.append(letter,t);b.onclick=()=>{answers[index]=i;draw()};$("#options").append(b)});$("#back").disabled=index===0;$("#next").disabled=answers[index]===null;$("#next").innerHTML=index===list.length-1?'결과 보기 ✦':'다음 질문 →'}
// 점수 축: N=서사, C=도전, S=함께, M=창작. 상위 1위가 2위보다 3점 이상 높으면 단일 유형, 아니면 상위 두 축 조합.
// 동점은 N>C>S>M 순으로 고정하여 결과가 언제나 결정적입니다.
function scoreResult(){const scores={N:0,C:0,S:0,M:0};answers.forEach((answer,i)=>{if(i===4||i===6)return;if(i===5){if(answer===0)scores.C++;else if(answer===1)scores.S++;return}if(answer!==null&&axes[answer])scores[axes[answer]]++});const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]||axes.indexOf(a[0])-axes.indexOf(b[0]));const type=sorted[0][1]-sorted[1][1]>=3?sorted[0][0]:sorted[0][0]+sorted[1][0];return {scores,type,solo:answers[4]===0,combat:answers[5],combatStyle:answers[6]}}
function showResult(){const {scores,type,solo,combat}=scoreResult(),r=results[type];result.innerHTML=`<div class="result-top"><span class="eyebrow">당신의 플레이 스타일</span><span class="type">TYPE ${type}</span></div><h2 class="result-title"></h2><p class="subtitle"></p><p class="desc"></p><h3 class="section-title">이런 게임을 추천해요</h3><div class="games"></div><h3 class="section-title">이런 답변에서 취향을 찾았어요</h3><ul class="reasons"></ul><p class="shareline"></p><div class="result-actions"><button class="primary" id="again">다시 테스트하기 ↻</button><button class="secondary" id="copy">결과 공유하기</button></div>`;$(".result-title").textContent=r.title;$(".subtitle").textContent=r.sub;$(".desc").textContent=r.desc;const safeGames=(solo?{"S":["언패킹","저니","디스코 엘리시움"],"NS":["라이프 이즈 스트레인지","옥센프리","저니"],"SM":["언패킹","스타듀 밸리","동물의 숲: 뉴 호라이즌"]}[type]||r.games.map(g=>g[0]):r.games.map(g=>g[0]));const filteredGames=r.games.filter(([name])=>!(combat===3&&["하데스","엘든 링","에이펙스 레전드","딥 락 갤럭틱","로켓 리그"].includes(name)));(filteredGames.length?filteredGames:r.games.filter(([name])=>!["하데스","엘든 링","에이펙스 레전드","딥 락 갤럭틱","로켓 리그"].includes(name))).forEach(([name,why])=>{const a=document.createElement("article");a.className="game";const h=document.createElement("h4");h.textContent=name;const p=document.createElement("p");p.textContent=why;a.append(h,p);$(".games").append(a)});r.reasons.forEach(text=>{const li=document.createElement("li");li.textContent=text;$(".reasons").append(li)});$(".shareline").textContent=`취향 점수 · 서사 ${scores.N}　도전 ${scores.C}　함께 ${scores.S}　창작 ${scores.M}`;intro.classList.add("hidden");quiz.classList.add("hidden");result.classList.remove("hidden");result.scrollIntoView({behavior:"smooth",block:"start"});$("#again").onclick=()=>{answers.fill(null);index=0;result.classList.add("hidden");intro.classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})};$("#copy").onclick=async e=>{const b=e.currentTarget;try{await navigator.clipboard.writeText(`내 취향에 맞을 게임은?\n${r.title}\n추천: ${r.games.map(g=>g[0]).join(", ")}`);b.textContent="복사 완료 ✓"}catch{b.textContent="복사를 지원하지 않는 환경이에요"}}}
$("#start").onclick=()=>{intro.classList.add("hidden");quiz.classList.remove("hidden");index=0;draw();quiz.scrollIntoView({behavior:"smooth",block:"start"})};$("#back").onclick=()=>{if(index>0){index--;draw()}};$("#next").onclick=()=>{if(answers[index]===null)return;if(index===5&&answers[5]===3){index++;draw();return}if(index<activeQuestions().length-1){index++;draw()}else{$("#fill").style.width="100%";$(".track").setAttribute("aria-valuenow",activeQuestions().length);showResult()}};
</script></body></html>
